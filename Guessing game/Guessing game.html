<!DOCTYPE html>
<html>
<head>
    <title>Guessing The Number</title>
</head>
<body>
    <h1 style="background-color: red;">Guessing The Number</h1>
    <p style="background-color: red;"> Think you've got sharp instincts?<br>
        Put them to the test! In Guess teh<br> Number,
        a secret number between<br> 1 & 20 is randomly chosen - <br>
        your mission is to find it in as few <br>
        tries a s possible.</p>
 <script>
 // Create an array of words
 var words = [
 "javascript",
 "monkey",
 "amazing",
 "pancake"
 ];
 // Pick a random word
 var word = words[Math.floor(Math.random() * words.length)];
 // Set up the answer array
 var answerArray = [];
 for (var i = 0; i < word.length; i++) {
 answerArray[i] = "_";
 }
 var remainingLetters = word.length;
 // The game loop
 while (remainingLetters > 0) {
 // Show the player their progress
 alert(answerArray.join(" "));
 // Get a guess from the player
 var guess = prompt("Guess a letter, or click Cancel to stop playing.");
 if (guess === null) {
 // Exit the game loop
 break;
 } else if (guess.length !== 1) {
 alert("Please enter a single letter.");
 } else {
 // Update the game state with the guess
 for (var j = 0; j < word.length; j++) {
 if (word[j] === guess) {
 answerArray[j] = guess;
 remainingLetters--;
 }
 }
 }
 // The end of the game loop
 }
 // Show the answer and congratulate the player
 alert(answerArray.join(" "));
 alert("Good job! The answer was " + word);
 </script>
</body>
</html>
